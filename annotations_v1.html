  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

  <style>
    :root {
      /* High-Contrast Low-Fatigue Daylight Palette for 8-Hour Shifts */
      --bg-app: #eef2f6;
      --bg-header: #ffffff;
      --bg-subbar: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-header: #f1f5f9;
      --bg-col-head: #f8fafc;
      --bg-row-hover: #e2e8f0;
      --bg-input: #ffffff;
      --bg-cell-ann: #eff6ff;
      --bg-cell-ann-hover: #dbeafe;
      --bg-cell-blurb: #ecfdf5;
      --bg-cell-blurb-hover: #d1fae5;
      --bg-cell-standings: #fffbeb;
      --bg-cell-standings-hover: #fef3c7;
      --bg-cell-both: #f1f5f9;
      --bg-cell-both-hover: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --text-dim: #64748b;
      --border-color: #cbd5e1;
      --border-subtle: #e2e8f0;
    }

    html.dark {
      /* Ergonomic 8-Hour Low-Glare Slate Palette for 24" FHD ThinkCentre Monitor */
      --bg-app: #0b1017;
      --bg-header: #101722;
      --bg-subbar: #141d2b;
      --bg-card: #131b26;
      --bg-card-header: #192332;
      --bg-col-head: #101722;
      --bg-row-hover: #1d293b;
      --bg-input: #0c121b;
      --bg-cell-ann: rgba(37, 99, 235, 0.14);
      --bg-cell-ann-hover: rgba(59, 130, 246, 0.28);
      --bg-cell-blurb: rgba(16, 185, 129, 0.13);
      --bg-cell-blurb-hover: rgba(16, 185, 129, 0.26);
      --bg-cell-standings: rgba(245, 158, 11, 0.15);
      --bg-cell-standings-hover: rgba(245, 158, 11, 0.28);
      --bg-cell-both: rgba(148, 163, 184, 0.12);
      --bg-cell-both-hover: rgba(148, 163, 184, 0.24);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border-color: #263447;
      --border-subtle: #1d2837;
    }

    html.sepia-mode {
      /* Warm Low-Blue-Light Shift Mode */
      --bg-app: #161412;
      --bg-header: #1f1c18;
      --bg-subbar: #25211c;
      --bg-card: #1e1b17;
      --bg-card-header: #27231e;
      --bg-col-head: #1a1714;
      --bg-row-hover: #2d2822;
      --bg-input: #141210;
      --bg-cell-ann: rgba(217, 119, 6, 0.15);
      --bg-cell-ann-hover: rgba(217, 119, 6, 0.28);
      --bg-cell-blurb: rgba(16, 185, 129, 0.13);
      --bg-cell-blurb-hover: rgba(16, 185, 129, 0.26);
      --bg-cell-standings: rgba(245, 158, 11, 0.18);
      --bg-cell-standings-hover: rgba(245, 158, 11, 0.32);
      --bg-cell-both: rgba(181, 168, 149, 0.12);
      --bg-cell-both-hover: rgba(181, 168, 149, 0.24);
      --text-main: #ebe3d5;
      --text-muted: #b5a895;
      --text-dim: #847868;
      --border-color: #383129;
      --border-subtle: #2b2620;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    .app-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
    }

    .app-subbar {
      background-color: var(--bg-subbar);
      border-bottom: 1px solid var(--border-color);
    }

    .autofill-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      user-select: text;
    }
    .autofill-input:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.22);
    }

    .cat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .cat-header {
      background-color: var(--bg-card-header);
      border-bottom: 1px solid var(--border-subtle);
    }

    .col-subhead {
      background-color: var(--bg-col-head);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }

    .scenario-row {
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color 0.08s ease;
    }
    .scenario-row:last-child {
      border-bottom: none;
    }
    .scenario-row:hover {
      background-color: var(--bg-row-hover);
    }

    .cell-btn {
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .cell-btn:active {
      transform: scale(0.96);
    }

    .cell-ann {
      background-color: var(--bg-cell-ann);
      border-left: 1px solid var(--border-subtle);
    }
    .cell-ann:hover {
      background-color: var(--bg-cell-ann-hover);
    }

    .cell-blurb {
      background-color: var(--bg-cell-blurb);
      border-left: 1px solid var(--border-subtle);
    }
    .cell-blurb:hover {
      background-color: var(--bg-cell-blurb-hover);
    }

    .cell-standings {
      background-color: var(--bg-cell-standings);
      border-left: 1px solid var(--border-subtle);
    }
    .cell-standings:hover {
      background-color: var(--bg-cell-standings-hover);
    }

    .cell-both {
      background-color: var(--bg-cell-both);
      border-left: 1px solid var(--border-subtle);
    }
    .cell-both:hover {
      background-color: var(--bg-cell-both-hover);
    }

    .cell-empty {
      border-left: 1px solid var(--border-subtle);
      opacity: 0.4;
    }

    .copied-flash {
      background-color: #10b981 !important;
      color: #ffffff !important;
      font-weight: 700 !important;
    }

    /* Calibrated for 24-inch Full HD (1920x1080) ThinkCentre 1-Page Fit */
    .density-fhd .scenario-row {
      min-height: 24px;
      font-size: 11.2px;
      line-height: 1.15;
    }
    .density-fhd .cat-header {
      padding: 4px 8px;
      font-size: 11px;
    }
    .density-comfortable .scenario-row {
      min-height: 32px;
      font-size: 12.5px;
      line-height: 1.25;
    }
    .density-comfortable .cat-header {
      padding: 7px 10px;
      font-size: 12px;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>
</head>

g to resolve it as quickly as possible. No action is needed from you. We appreciate your patience. Most delivery partners will receive a response within six (6) days.\n\nThe Amazon Flex Team\n\nFor faster access to driver support, try live chat by signing in to the Amazon Flex app and going to the main menu > Help > Contact us.", "id": "item_39", "category_display": "Terms & App / Account", "result_display": "RCA (Reason Code Abuse)", "sls_code": "amazon_flex_sls_ticket_no_ETA", "tone": "amber"}, {"status": "Active", "category": "Others", "result": "General Captcha", "fields": {"read_email": "Yes", "understand_issue": "No", "dp_status": "Active", "dp_issue": "why receiving captccha", "past_7_days": "No", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Too many puzzles amazon_flex_captcha_why"}, "blurb": "Hi,\n\nThank you for contacting Amazon Flex.\n\nProviding you the best possible experience while delivering with Amazon Flex is our highest priority. We want to ensure you're able to view all available offers and schedule blocks that fit your schedule. A CAPTCHA challenge is a simple visual or audio test. It's used to ensure you're a human and not an automated service trying to schedule a block in the Amazon Flex app.\n\nWhen you're ready to schedule an offer, you may be asked to complete a CAPTCHA requirement. Complete the challenge successfully and you'll be returned to the \"reserve now\" page where you can continue with choosing an offer.\n\nFor faster access to Support, try the live chat or talk to us by signing in to the Amazon Flex app and going to the Main Menu > Help > Contact us. Available in English and Spanish.\n\nThe Amazon Flex Team", "id": "item_40", "category_display": "General & Support (Active)", "result_display": "General CAPTCHA Why", "sls_code": "amazon_flex_captcha_why", "tone": "sky"}, ster access to Support, try the live chat or talk to us by signing in to the Amazon Flex app and going to the Main Menu > Help > Contact us. Available in English and Spanish.", "id": "item_42", "category_display": "Terms & App / Account", "result_display": "ONP (Order Not Picked Up)", "sls_code": "amazon_flex_sls_received_information", "tone": "amber"}, {"status": "Active", "category": "Others", "result": "Transfer (payments)", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "DP appealing for payments", "past_7_days": "Yes", "syska": "No", "block_details": "Yes", "open_sims": "No", "sim_link": "No related SIM", "merit_exemption": "No", "payment_query": "Yes", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "transferred to payments"}, "blurb": "", "id": "item_43", "category_display": "General & Support (Active)", "result_display": "Transfer to Payments", "sls_code": "", "tone": "sky"}, {"status": "Active", "category": "ODQ", "result": "POND", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "Partial Order Not Delivered (POND)", "past_7_days": "Yes", "syska": "No", "block_details": "NA", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Partial Order Not Delivered (POND) TT Closed as No Issue - amazon_flex_sls_alert_appeal_proactive"}, "blurb": "Hello,\n\nThank you for sharing this information. We have noted this information in your account.\n\nPlease note that while the information has been recorded, it may not have any bearing on an appeal or investigation.\n\nThank you for delivering with Amazon Flex.\n\nThe Amazon Flex Team.", "id": "item_44", "category_display": "ODQ (On-Road Quality)", "result_display": "POND (Partial Not Deliv.)", "sls_code": "amazon_flex_sls_alert_appeal_proactive", "tone": "sky"}, {"status": "Active", "category": "Terms", "result": "Region Change", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "DP Wants to Change Region", "past_7_days": "Yes", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Region Change - amazon_flex_region_change_availability_where"}, "blurb": "Hello,\n\nThank you for contacting Amazon Flex.\n\nIf your Rewards Tier status is Level 2 or higher, you can transfer to a new region once every 7 days. It applies if there are available opportunities within the region. To check if there are available opportunities in your desired region, navigate to Settings in the Amazon Flex app: Personal Information > Region > Request region change > Enter your preferred Zip Code > Continue.\n\nIf there is availability, you will be shown a list of available regions. If there are no available opportunities in your desired Zip Code, the Amazon Flex app will notify you. Once you switch regions, you will only be able to switch back to your previous region if there are available opportunities.\n\nRegion changes are not guaranteed and are dependent upon available opportunities in the desired region.\n\nThank you for delivering with Amazon Flex.\n\nThe Amazon Flex Team", "id": "item_45", "category_display": "Terms & App / Account", "result_display": "Region Change", "sls_code": "amazon_flex_region_change_availability_where", "tone": "sky", "acht_booster": true}, {"status": "Active", "category": "Others", "result": "block cancel", "fields": {"read_email": "Yes", "understand_issue": "No", "dp_status": "Active", "dp_issue": "cancelling block", "past_7_days": "No", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "cancel info provided - cancel availability"}, "blurb": "Hello,\n\nIf you need to cancel a delivery block, please follow the timing guidelines below based on your block type:\n\n1. AMZL and SSD scheduled-ahead blocks. You must forfeit the block at least 45 minutes before the start time in the app. Otherwise, it will be considered a missed block.\n2. Amazon Now Instant Offers: Forfeit in the app at least 90 seconds before the block start time.\n\n\n\nIf you need to cancel an AMZL or SSD block within 45 minutes of its start time, you'll have a 5-minute grace period to forfeit without penalty. This forfeiture won't count as a missed delivery block.\n\nTo forfeit an accepted block:\n\n1. In the Amazon Flex app, select the Menu icon and then select Calendar.\n\n2. Select a day to view additional details, and then select the block you want to forfeit.\n\n3. Select Forfeit This Time and then swipe to confirm.\n\nFor more information on scheduling delivery blocks and preferred scheduling, refer to https://flex.amazon.com/faq.\n\n\n\nThe Amazon Flex Team.", "id": "item_46", "category_display": "General & Support (Active)", "result_display": "Block Cancel Guidelines", "sls_code": "", "tone": "sky"}, {"status": "Active", "category": "ODQ", "result": "PDNR", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "Partial Delivered Not Received (PDNR)", "past_7_days": "Yes", "syska": "No", "block_details": "NA", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Partial Delivered Not Received (PDNR) TT Closed as No Issue - amazon_flex_sls_alert_appeal_proactive"}, "blurb": "Hello,\n\nThank you for sharing this information. We have noted this information in your account.\n\nPlease note that while the information has been recorded, it may not have any bearing on an appeal or investigation.\n\nThank you for delivering with Amazon Flex.\n\nThe Amazon Flex Team.", "id": "item_47", "category_display": "ODQ (On-Road Quality)", "result_display": "PDNR (Partial DNR)", "sls_code": "amazon_flex_sls_alert_appeal_proactive", "tone": "sky"}, {"status": "Active", "category": "Terms", "result": "More Offers", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "Worried About Offers", "past_7_days": "Yes", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "No related SIM", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Information provided to dp on offers details - amazon_flex_offers_availability"}, "blurb": "Hello,\n\nThank you for contacting Amazon Flex.\n\nThe amount of work available to all Amazon Flex delivery partners depends on customer demand and changes week to week. You can see available work by going to the \"Offers\" page in the Amazon Flex app. When you're on the page, select 'Refresh' to see the latest offers.\n\nEach delivery partner sees different offers. The offers you see may depend on the amount of work you’ve done recently, the work you’ve reserved in the future, whether you’ve cancelled many work, your Delivery Quality, and your Reliability. We know that life happens and sometimes you need to cancel or can’t show up on time.\n\nHowever, if you do it frequently, it makes it harder for us to ensure that customers will get their packages on time. Having many cancellations or frequently being late means you won't get the first choice of offers. If you haven't worked recently or don't have any blocks scheduled, you'll have a better chance of seeing offers.\n\nYou can also set filters for times of day and stations that work for you on your \"Offers\" page. You can see your favorite offers first by selecting \"Upcoming Offers\" and selecting \"Filter\" in the upper-left corner of the screen. Select \"Show all other offers\" to see all available offers if you have filters applied.\n\nWe add offers every day and at multiple times during the day. If you don't see any offers at the moment, check back in a few hours.\n\nFor faster access to Support, try the live chat or talk to us by signing in to the Amazon Flex app and going to the Main Menu > Help > Contact us. Available in English and Spanish.\n\nThe Amazon Flex Team", "id": "item_48", "category_display": "Terms & App / Account", "result_display": "More Offers Inquiry", "sls_code": "amazon_flex_offers_availability", "tone": "sky"}, {"status": "Active", "category": "Others", "result": "Feedback", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "Feedback", "past_7_days": "Yes", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Negative Feedback by DP - amazon_flex_program_feedback_neg"}, "blurb": "Hello,\n\nThank you for contacting Amazon Flex.\n\nWe are sorry to hear that you have had a negative experience with Amazon Flex. We want to provide an exceptional experience for Amazon Flex delivery partners and greatly value feedback from our delivery partners.\n\nWe appreciate that you took the time to write to us, and we've passed your feedback along to the appropriate team for review.", "id": "item_49", "category_display": "General & Support (Active)", "result_display": "DP Feedback (Neg)", "sls_code": "amazon_flex_program_feedback_neg", "tone": "sky", "acht_booster": true}, {"status": "Active", "category": "Terms", "result": "App Issue", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "App Issue", "past_7_days": "Yes", "syska": "No", "block_details": "No", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "App Issue - amazon_flex_app_logout_login"}, "blurb": "Hello,\n\nI'm sorry to hear that you are experiencing issues with the Amazon Flex app.\n\nHave you tried logging out and logging back into the app? We have noticed that this solves the most common issues.\n\nTo sign out of the Amazon Flex app:\n\n1. Tap the Main Menu icon.\n\n2. Tap \"Settings.\"\n\n3. Tap \"Sign out\" at the bottom of the screen.\n\nOnce you are signed out, to sign back in just click the \"Sign in with Amazon\" button and log in.\n\nFor faster access to Support, try live chat or talk to us by signing in to the Amazon Flex app and going to the Main Menu > Help > Contact us.", "id": "item_50", "category_display": "Terms & App / Account", "result_display": "App Issue (Login/Logout)", "sls_code": "amazon_flex_app_logout_login", "tone": "sky", "acht_booster": true}, {"status": "Active", "category": "Others", "result": "Standings", "fields": {"read_email": "Yes", "understand_issue": "Yes", "dp_status": "Active", "dp_issue": "Standings", "past_7_days": "Yes", "syska": "No", "block_details": "NA", "open_sims": "No", "sim_link": "", "merit_exemption": "No", "payment_query": "No", "missed_block_app": "No", "multiple_issues": "No", "dnr_followup": "No", "resolution": "Standings Information Provided"}, "blurb": "Hi,\n\nThank you for contacting Amazon Flex.\n\nOn average, your standing reflects about six weeks of your delivery history, so it will take time to change. The more blocks that you complete, the faster your standing can improve. If you don't deliver as often, it will take longer to improve.\n\nThe best way to improve is to look at your standing, which tells you how you're doing in the Amazon Flex program. It's made up of three areas: Arrival and pickup, Delivery, and Terms of Service.\n\nTo see how you're doing within these areas and find out ways to improve, look at your Standing Details under Your Dashboard in the Amazon Flex app. You can select each area to see details of any         container.innerHTML = Object.keys(byCat).map(catKey => {
          const list = byCat[catKey];
          const isCore = CORE_APPEAL_CATS.includes(catKey);
          const isAcht = catKey === "ACHT Booster";
          return renderCategoryCard(list[0].category_display, list, { isCoreAppeal: isCore, isAchtCard: isAcht, showBothBtn: isAcht });
        }).join("");
        return;
      }

      // DEFAULT 1-PAGE 24" FULL HD (1920x1080) THINKCENTRE BENTO MATRIX:
      // Columns 1–4: ALL Active Blurbs & Annotations
      // Columns 5–6: Onboarding, Inactive, and Offboarded
      const achtActive = (byCat["ACHT Booster"] || []).filter(x =>
        ["acht_1", "acht_2", "acht_3", "acht_8"].includes(x.id)
      );
      const inactiveAll = [...(byCat["DLV Inactive"] || []), ...(byCat["SDP"] || [])];

      container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-2.5 items-start";
      container.innerHTML = [
        // Col 1 (Active): DCR (6) + Late Delivery (5) + Unattempted (3) = 14 rows
        `<div class="space-y-2">
          ${renderLaneHeader("Col 1 • Active: Delivery Appeals")}
          ${renderCategoryCard("DCR (Delivery Completion)", byCat["DCR"], { isCoreAppeal: true })}
          ${renderCategoryCard("Late Delivery", byCat["Late Delivery"], { isCoreAppeal: true })}
          ${renderCategoryCard("Unattempted Packages", byCat["Unattempted"])}
        </div>`,

        // Col 2 (Active): Missed Block (6) + Late Forfeit (6) + DP Reputation (2) = 14 rows (Aligned row-for-row with Col 1!)
        `<div class="space-y-2">
          ${renderLaneHeader("Col 2 • Active: Block & Forfeit")}
          ${renderCategoryCard("Missed Block", byCat["missed block"], { isCoreAppeal: true })}
          ${renderCategoryCard("Late Forfeit / Cancel", byCat["late Forfeit"], { isCoreAppeal: true })}
          ${renderCategoryCard("DP Reputation (Safety)", byCat["DP Reputation"])}
        </div>`,

        // Col 3 (Active): DNR (4) + Return Issue (3) + ODQ (5) = 12 rows
        `<div class="space-y-2">
          ${renderLaneHeader("Col 3 • Active: DNR, RTS & ODQ")}
          ${renderCategoryCard("DNR (Delivered Not Received)", byCat["DNR"])}
          ${renderCategoryCard("Return Issue (RTS)", byCat["Return Issue"])}
          ${renderCategoryCard("ODQ (On-Road Quality)", byCat["ODQ"])}
        </div>`,

        // Col 4 (Active): Terms (6) + General & Support (7) + ACHT Booster Active (4) = 17 rows
        `<div class="space-y-2">
          ${renderLaneHeader("Col 4 • Active: Terms & Support")}
          ${renderCategoryCard("Terms & App / Account", byCat["Terms"])}
          ${renderCategoryCard("General & Support (Active)", byCat["Others"])}
          ${renderCategoryCard("ACHT Booster (Active Triage)", achtActive, { isAchtCard: true })}
        </div>`,

        // Col 5 (Onboarding & Inactive): Waitlisted (2) + BGC (5) + Inactive DLV & SDP (7) = 14 rows
        `<div class="space-y-2">
          ${renderLaneHeader("Col 5 • Onboarding & Inactive")}
          ${renderCategoryCard("Waitlisted on Region", byCat["Waitlisted on region"])}
          ${renderCategoryCard("Background Check (BGC)", byCat["BGC"])}
          ${renderCategoryCard("Driver License (DLV) & Inactive", inactiveAll)}
        </div>`,

        // Col 6 (Offboarded & Others): Offboarded Appeals (5) + Voluntary & Non-Account (6) + Escalation Queues = 17 rows
        `<div class="space-y-2">
          ${renderLaneHeader("Col 6 • Offboarded & Non-Account")}
          ${renderCategoryCard("Offboarded Appeals", byCat["Offboarded"])}
          ${renderCategoryCard("Voluntary Offboard & Others", byCat["Voluntary & Other Non-Active"])}
          ${renderAchtQuickQueuesCard()}
        </div>`
      ].join("");
    }

    function openInspector(itemId) {
      const item = APP_DATA.items.find(x => x.id === itemId);
      if (!item) return;
      state.inspectedItemId = itemId;

      const badge = document.getElementById("inspStatusBadge");
      badge.textContent = item.category === "ACHT Booster" ? `ACHT Booster • ${item.status}` : item.status;
      const statusColorMap = {
        Active: "bg-emerald-500/20 text-emerald-500 dark:text-emerald-300 border-emerald-500/30",
        Onboarding: "bg-sky-500/20 text-sky-500 dark:text-sky-300 border-sky-500/30",
        Inactive: "bg-amber-500/20 text-amber-500 dark:text-amber-300 border-amber-500/30",
        Offboarded: "bg-rose-500/20 text-rose-500 dark:text-rose-300 border-rose-500/30"
      };
      const badgeCls = item.category === "ACHT Booster"
        ? "bg-violet-500/20 text-violet-500 dark:text-violet-300 border-violet-500/30"
        : (statusColorMap[item.status] || statusColorMap.Active);
      badge.className = `px-2 py-0.5 rounded text-xs font-bold uppercase border ${badgeCls}`;

      document.getElementById("inspTitle").textContent = `${item.category_display} → ${item.result_display}`;
      document.getElementById("inspAnnTextarea").value = buildAnnotationText(item);
      document.getElementById("inspBlurbTextarea").value = buildBlurbText(item) || "(No email blurb required for this scenario)";

      document.getElementById("inspectorModal").classList.remove("hidden");
    }

    function syncStatusTabsUI() {
      document.querySelectorAll(".status-tab").forEach(btn => {
        const st = btn.getAttribute("data-status");
        if (st === state.statusFilter) {
          btn.className = "status-tab px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all bg-blue-600 text-white shadow-xs flex items-center gap-1";
        } else {
          btn.className = "status-tab px-2.5 py-1 rounded-md text-[11px] font-medium transition-all hover:text-blue-400 flex items-center gap-1 text-slate-700 dark:text-slate-300";
        }
      });
    }

    function applyThemeUI() {
      const root = document.documentElement;
      root.classList.remove("dark", "sepia-mode");
      if (state.theme === "dark") {
        root.classList.add("dark");
      } else if (state.theme === "sepia") {
        root.classList.add("dark", "sepia-mode");
      }
      document.querySelectorAll(".theme-btn").forEach(btn => {
        const t = btn.getAttribute("data-theme");
        if (t === state.theme) {
          btn.className = "theme-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-600 text-white";
        } else {
          btn.className = "theme-btn px-2 py-0.5 rounded text-[11px] font-medium hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300";
        }
      });
    }

    function applyDensityUI() {
      document.body.classList.remove("density-fhd", "density-comfortable");
      if (state.density === "comfortable") {
        document.body.classList.add("density-comfortable");
        document.getElementById("densityBtn").textContent = "🖥️ Comfortable";
      } else {
        document.body.classList.add("density-fhd");
        document.getElementById("densityBtn").textContent = "🖥️ 1-Page FHD";
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadSavedState();

      document.getElementById("copyCounter").textContent = String(state.copiedCount);

      applyThemeUI();
      applyDensityUI();
      syncStatusTabsUI();
      renderMatrix();

      document.querySelectorAll("[data-contact='chime']").forEach(el => {
        el.addEventListener("click", () => {
          copyTextToClipboard("@tafrokha", "Copied Chime Handle: @tafrokha", "Opening Amazon Chime...", null);
        });
      });

      document.getElementById("statusTabs").addEventListener("click", e => {
        const btn = e.target.closest(".status-tab");
        if (!btn) return;
        state.statusFilter = btn.getAttribute("data-status");
        syncStatusTabsUI();
        renderMatrix();
      });

      const searchInput = document.getElementById("searchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      searchInput.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        clearSearchBtn.classList.toggle("hidden", !state.searchQuery);
        renderMatrix();
      });
      clearSearchBtn.addEventListener("click", () => {
        state.searchQuery = "";
        searchInput.value = "";
        clearSearchBtn.classList.add("hidden");
        renderMatrix();
      });

      window.addEventListener("keydown", e => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === "Escape") {
          document.getElementById("inspectorModal").classList.add("hidden");
          document.getElementById("standingsPopover").classList.add("hidden");
        }
      });

      document.getElementById("densityBtn").addEventListener("click", () => {
        state.density = state.density === "fhd" ? "comfortable" : "fhd";
        savePrefs();
        applyDensityUI();
      });

      document.querySelectorAll(".theme-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.theme = btn.getAttribute("data-theme");
          savePrefs();
          applyThemeUI();
        });
      });

      document.querySelectorAll(".standing-copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const st = btn.getAttribute("data-standing");
          const text = APP_DATA.standings[st];
          copyTextToClipboard(text, `Copied ${st} Standing Blurb!`, `${st} standing email response (${text.length} chars)`, btn);
        });
      });

      const simInput = document.getElementById("tokenSimInput");
      const dateInput = document.getElementById("tokenDateInput");
      const resInput = document.getElementById("tokenResInput");
      const nativeDatePicker = document.getElementById("nativeDatePicker");

      simInput.addEventListener("input", e => {
        state.simToken = e.target.value;
        refreshOpenInspector();
      });
      dateInput.addEventListener("input", e => {
        state.dateToken = e.target.value;
        refreshOpenInspector();
      });
      resInput.addEventListener("input", e => {
        state.resNotesToken = e.target.value;
        refreshOpenInspector();
      });

      document.getElementById("fillTodayBtn").addEventListener("click", () => {
        const formatted = formatStandardDate(new Date());
        state.dateToken = formatted;
        dateInput.value = formatted;
        refreshOpenInspector();
        showToast("Date Set to Today", formatted);
      });

      document.getElementById("fillYesterdayBtn").addEventListener("click", () => {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        const formatted = formatStandardDate(d);
        state.dateToken = formatted;
        dateInput.value = formatted;
        refreshOpenInspector();
        showToast("Date Set to Yesterday", formatted);
      });

      document.getElementById("copyDateOnlyBtn").addEventListener("click", e => {
        if (!state.dateToken.trim()) {
          const formatted = formatStandardDate(new Date());
          state.dateToken = formatted;
          dateInput.value = formatted;
          refreshOpenInspector();
        }
        copyTextToClipboard(state.dateToken, "Copied Standard Date!", state.dateToken, e.currentTarget);
      });

      nativeDatePicker.addEventListener("change", e => {
        if (!e.target.value) return;
        const parts = e.target.value.split("-");
        if (parts.length === 3) {
          const picked = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          const formatted = formatStandardDate(picked);
          state.dateToken = formatted;
          dateInput.value = formatted;
          refreshOpenInspector();
          showToast("Date Selected", formatted);
        }
      });

      document.getElementById("clearTokensBtn").addEventListener("click", () => {
        state.simToken = "";
        state.dateToken = "";
        state.resNotesToken = "";
        simInput.value = "";
        dateInput.value = "";
        resInput.value = "";
        nativeDatePicker.value = "";
        refreshOpenInspector();
        showToast("Auto-Fill Cleared", "SIM Link, Date, and Resolution Notes reset");
      });

      let activeStandingsTriggerEl = null;
      document.getElementById("matrixContainer").addEventListener("click", e => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");

        if (action === "copy-qref") {
          const val = btn.getAttribute("data-val");
          const label = btn.getAttribute("data-label");
          copyTextToClipboard(val, `Copied: ${val}`, label, btn);
          return;
        }

        const id = btn.getAttribute("data-id");
        const item = APP_DATA.items.find(x => x.id === id);
        if (!item) return;

        if (action === "copy-ann") {
          const text = buildAnnotationText(item);
          copyTextToClipboard(
            text,
            `Copied Annotation: ${item.result_display}`,
            `${item.category_display}`,
            btn
          );
        } else if (action === "copy-blurb") {
          const text = buildBlurbText(item);
          copyTextToClipboard(
            text,
            `Copied Blurb: ${item.result_display}`,
            `${item.category_display} (${text.length} chars)`,
            btn
          );
        } else if (action === "copy-both") {
          const ann = buildAnnotationText(item);
          const blurb = buildBlurbText(item);
          const combined = ann + "\n\n========================================\n\n" + blurb;
          copyTextToClipboard(
            combined,
            `Copied ACHT Pair (Ann + Blurb)!`,
            `${item.result_display}`,
            btn
          );
        } else if (action === "copy-standings") {
          activeStandingsTriggerEl = btn;
          const rect = btn.getBoundingClientRect();
          const pop = document.getElementById("standingsPopover");
          pop.classList.remove("hidden");
          const topPos = Math.min(window.innerHeight - 130, rect.bottom + 6);
          const leftPos = Math.max(12, Math.min(window.innerWidth - 270, rect.left - 160));
          pop.style.top = topPos + "px";
          pop.style.left = leftPos + "px";
        } else if (action === "inspect") {
          openInspector(id);
        }
      });

      document.querySelectorAll(".pop-standing-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const st = btn.getAttribute("data-pop-standing");
          const text = APP_DATA.standings[st];
          document.getElementById("standingsPopover").classList.add("hidden");
          copyTextToClipboard(text, `Copied ${st} Standing Blurb!`, `Selected from Standings Popover`, activeStandingsTriggerEl);
        });
      });
      document.getElementById("closePopoverBtn").addEventListener("click", () => {
        document.getElementById("standingsPopover").classList.add("hidden");
      });

      document.getElementById("closeInspectorBtn").addEventListener("click", () => {
        document.getElementById("inspectorModal").classList.add("hidden");
      });
      document.getElementById("inspCopyAnnBtn").addEventListener("click", e => {
        const text = document.getElementById("inspAnnTextarea").value;
        copyTextToClipboard(text, "Copied Custom Annotation!", "From Live Inspector", e.currentTarget);
      });
      document.getElementById("inspCopyBlurbBtn").addEventListener("click", e => {
        const text = document.getElementById("inspBlurbTextarea").value;
        copyTextToClipboard(text, "Copied Custom Blurb!", "From Live Inspector", e.currentTarget);
      });
      document.getElementById("inspCopyBothBtn").addEventListener("click", e => {
        const ann = document.getElementById("inspAnnTextarea").value;
        const blurb = document.getElementById("inspBlurbTextarea").value;
        const combined = ann + "\n\n========================================\n\n" + blurb;
        copyTextToClipboard(combined, "Copied Annotation + Blurb!", "Combined clipboard copy", e.currentTarget);
      });
    });
  </script>
</body>
</html>
